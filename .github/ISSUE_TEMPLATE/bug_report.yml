name: Bug Report
description: Report a bug to help us improve pcmon
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Description
        A clear and concise description of what the bug is.

  - type: textarea
    id: repro
    attributes:
      label: "Reproduction Steps"
      description: "How to reproduce this bug. Be specific."
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened instead."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "pcmon Version"
      description: "Run `.\pcmon.ps1 -Help` to check version"
      placeholder: "e.g., 1.0.0"

  - type: textarea
    id: logs
    attributes:
      label: "Error Output / Logs"
      description: "Any relevant error messages or logs"
