name: Feature Request
description: Suggest a new feature or improvement for pcmon
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Description
        A clear and concise description of the feature you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "What problem does this solve? Why is this needed?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "How should this feature work?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions you've considered"

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Screenshots, examples, or other context"
